name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: btravstack/tools/.github/workflows/ci-reusable.yml@01ed3e01c672c04f59d48469c4558980fb685f26 # workflows-v1
    with:
      node-versions: '["", "22.23.2"]'
