name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: btravstack/tools/.github/workflows/ci-reusable.yml@022bb36b7955698e6b813d27bacdf0c88ed70be1 # workflows-v1
    with:
      node-versions: '["", "22.23.2"]'
