autoInstallPeers: false
dedupePeerDependents: true
engineStrict: true
saveExact: true
strictPeerDependencies: true

packages:
  - packages/*
  - docs

catalog:
  "@bloodyowl/boxed": 3.4.0
  "@btravstack/commitlint": 0.1.0
  "@btravstack/lefthook": 0.1.1
  "@btravstack/oxlint": 0.2.1
  "@btravstack/theme": 1.7.0
  "@btravstack/tsconfig": 0.2.0
  "@btravstack/typedoc": 0.1.0
  "@changesets/cli": 2.31.1
  "@commitlint/cli": 21.2.1
  "@orpc/client": 2.0.0-beta.21
  "@orpc/contract": 2.0.0-beta.21
  "@orpc/server": 2.0.0-beta.21
  "@prisma/adapter-better-sqlite3": 7.9.0
  "@prisma/client": 7.9.0
  # Ranged, not pinned: published as a regular dependency of
  # @unthrown/standard-schema — an exact pin would block dedupe with a
  # consumer's own copy of the (types-only) spec package.
  "@standard-schema/spec": ^1.1.0
  "@testcontainers/postgresql": 12.0.4
  "@types/node": 26.1.1
  # 8.20.1/8.20.2/8.20.3 are all within the minimumReleaseAge window as of
  # pinning; 8.20.0 is the newest release past it.
  "@types/pg": 8.20.0
  "@vitest/coverage-v8": 4.1.10
  better-sqlite3: 13.0.1
  # Ranged peer, exact catalog pin: we subclass drizzle internals
  # (`_prepare`, the `entityKind` brand), so bumps are deliberate.
  drizzle-orm: 1.0.0-rc.4
  effect: 3.22.0
  knip: 6.29.0
  lefthook: 2.1.10
  neverthrow: 8.2.0
  oxfmt: 0.60.0
  oxlint: 1.75.0
  pg: 8.22.0
  prisma: 7.9.0
  tsdown: 0.22.14
  tsx: 4.23.1
  turbo: 2.10.7
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.12.0
  typescript: 7.0.2
  vitepress: 1.6.4
  vitest: 4.1.10

catalogs:
  # TypeDoc's own TypeScript, deliberately NOT the default catalog's.
  #
  # `typescript: 7.0.2` above is the native port: the package ships a platform
  # binary plus `lib/version.cjs` and `./unstable/*` entry points, and no
  # `typescript.js` — the compiler API TypeDoc is written against does not exist
  # there. That is also what `typedoc@0.28`'s peer range says (`… || 6.0.x`).
  # 6.0.3 is the last release carrying the JS API.
  #
  # One `package.json` can name `typescript` once, and TypeDoc resolves its peer
  # from the importing package — so this split is also why `typedoc` runs from
  # the `docs` workspace rather than from each package, as it used to. Every
  # `packages/*` builds and typechecks on 7.0.2; only `docs` pins 6.0.3.
  typedoc:
    typescript: 6.0.3

# Force patched versions of vulnerable transitive dependencies. Every advisory
# below reaches us only through dev/build tooling (never a published package's
# runtime deps); the overrides span High and moderate severity. Each selector is
# version-scoped so only the affected line moves and unrelated lines are untouched.
overrides:
  # GHSA-3jxr-9vmj-r5cp (ReDoS) + GHSA-mh99-v99m-4gvg (DoS via unbounded
  # expansion length) + the later DoS via unbounded intermediate arrays, which
  # bypasses the CVE-2026-14257 mitigation and so is NOT fixed by 5.0.8.
  # Reaches us via typedoc > minimatch. 5.0.9 is the first release patched for
  # all three.
  "brace-expansion@5": "5.0.9"
  # The same unbounded-intermediate-arrays DoS in the 2.x line, plus the
  # unbounded-expansion-length one. New in this tree: @testcontainers/postgresql
  # > testcontainers > archiver pulls an old glob/minimatch. 2.1.4 is the first
  # 2.x release patched for both.
  "brace-expansion@2": "2.1.4"
  # GHSA-52cp-r559-cp3m: js-yaml quadratic-CPU merge keys in the legacy 3.x line
  # (via @changesets/cli > read-yaml-file). 3.15.0 is the patched 3.x release;
  # the unaffected 4.x line resolved elsewhere is left untouched.
  "js-yaml@3": "3.15.0"
  # GHSA-fx2h-pf6j-xcff: vite `server.fs.deny` bypass (dev-server only; the docs
  # ship as static HTML). Reaches us via docs > vitepress > vite. vitepress 1.6.x
  # pins vite ^5.4.14 and 5.x has no patched release, so lift any pre-6.4.3 vite
  # to 6.4.3 (the first fixed version) — the docs `vitepress build` is verified
  # against it. This also drags esbuild up to a patched 0.25.x.
  "vite@<6.4.3": "6.4.3"
  # GHSA-92pp-h63x-v22m (request smuggling, 1.x) + GHSA-frvp-7c67-39w9 (Windows
  # path traversal in `serve-static`, <2.0.5) + GHSA-9mqv-5hh9-4cgg (WebSocket
  # DoS, <=2.0.9): @hono/node-server, pulled in by the `prisma` CLI's dev server
  # (@prisma/dev). 2.0.10 is the first release patched for all three; the
  # resolved hono 4.x satisfies its `hono: ^4` peer.
  "@hono/node-server@<2.0.10": "2.0.10"
  # GHSA-v2hh-gcrm-f6hx: fast-uri host confusion via literal backslash authority
  # delimiter. Only the 3.x line is present (via ajv, under commitlint's config
  # loading and the `prisma` CLI). 3.1.4 was believed patched; the advisory was
  # subsequently widened to <3.1.5, so the floor moves with it. Scoped to the
  # vulnerable range so future patched 3.x releases resolve normally.
  "fast-uri@<3.1.5": "3.1.5"
  # GHSA-c96f-x56v-gq3h: find-my-way HTTP/2 DDoS (<=9.6.0), pulled in through
  # Prisma 7's @prisma/dev dependency chain. 9.7.0 is the first published
  # patched release.
  "find-my-way@<9.7.0": "9.7.0"
  # GHSA-5qjj-4xww-7phc: valibot inherited property path crash in flatten()
  # (<=1.4.1), also via @prisma/dev. Lift to the first fixed release.
  "valibot@<1.4.2": "1.4.2"

peerDependencyRules:
  ignoreMissing:
    # Optional analytics peer of VitePress's bundled Algolia DocSearch.
    - search-insights
    # React peers of `@prisma/studio-core`, pulled in transitively by the `prisma`
    # CLI (v7 bundles Prisma Studio). We never run `prisma studio`; the CLI is a
    # dev-only dependency of `@unthrown/prisma` (its test-client generation).
    - react
    - react-dom
    - "@types/react"

allowBuilds:
  # Prisma 7 is engine-less (WASM query compiler); nothing to build or download.
  "@prisma/engines": false
  # `testcontainers`' Docker transport (dockerode > ssh2) and its protobuf codec.
  # All three are optional native/codegen accelerations: `ssh2` only matters for
  # a Docker host reached over SSH (ours is the local daemon socket), and
  # `cpu-features` is `ssh2`'s own optional speed-up. Declared `false` rather
  # than left unanswered so `pnpm install` stays warning-free.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Native SQLite bindings for `@unthrown/prisma`'s tests (prebuilt binaries).
  better-sqlite3: true
  esbuild: true
  lefthook: true
  prisma: true

# Supply-chain maturity delay: don't adopt a freshly published version until it
# has been on the registry for 7 days (10080 minutes). Strict mode also validates
# the committed lockfile against this cutoff, so a same-day-published transitive
# dep fails the check instead of slipping in silently.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # First-party shared config (@btravstack scope): adopt immediately, skip the delay.
  - "@btravstack/commitlint"
  - "@btravstack/lefthook"
  - "@btravstack/oxlint"
  - "@btravstack/theme"
  - "@btravstack/tsconfig"
  - "@btravstack/typedoc"
  # Temporary security-patch exception: fast-uri 3.1.5 (the widened
  # GHSA-v2hh-gcrm-f6hx fix forced by the override above) is younger than the
  # cutoff. Remove this entry once 3.1.5 is 7 days old (published 2026-07-31).
  - fast-uri
  # Temporary security-patch exception: brace-expansion 5.0.9 and 2.1.4 (the
  # unbounded-intermediate-arrays fixes forced by the overrides above) are
  # younger than the cutoff. Remove this entry once both are 7 days old (both
  # published 2026-07-30).
  - brace-expansion
